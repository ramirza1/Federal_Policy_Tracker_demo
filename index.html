<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Federal Policy Tracker</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta name="description" content="US Federal Policy Tracker with Hybrid Vector Search">
    <meta name="keywords" content="US, Federal, Policy, Tracker, Typesense, OpenAI, Search">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FKRBBGLLFC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FKRBBGLLFC');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/instantsearch.css@7.3.1/themes/reset-min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="typesense-instantsearch-demo/src/app.css">

    <style>
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>US Federal Policy Tracker</h1>
            <a href="https://integrityinstitute.org/legislative-tracker" class="home-button">Home</a>
        </header>

        <div id="searchbox"></div>

        <div class="search-panel">
            <aside class="search-panel__filters">
                <h2>Filters</h2>

                <div>
                    <div id="current-session-filter"></div>
                </div>
                <div>
                    <h3>Policy Type</h3>
                    <div id="policy-type-list"></div>
                </div>
                <div>
                    <h3>Introduction Date</h3>
                    <div id="intro-date-picker"></div>
                </div>
                <div>
                    <h3>Themes</h3>
                    <div id="themes-list"></div>
                </div>
                <div>
                    <h3>Entity Type</h3>
                    <div id="entity-type-list"></div>
                </div>
                <div>
                    <h3>Status</h3>
                    <div id="status-list"></div>
                </div>
            </aside>

            <main class="search-panel__results">
                <div id="stats"></div>
                <div id="hits"></div>
                <div id="pagination"></div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4.46.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/typesense-instantsearch-adapter@2/dist/typesense-instantsearch-adapter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="typesense-instantsearch-demo/src/app.js"></script>
</body>
</html>
